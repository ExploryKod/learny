# Learny = repo root. Static Angular CSR: build output + SPA fallback.
# @netlify/angular-runtime 3.x declares no netlify.toml inputs; do not add packagePath
# (Netlify will reject it). For this app, the plugin is unnecessary — remove
# @netlify/angular-runtime from the Netlify UI “Build plugins” if it is still enabled
# (it only matters for Netlify’s Angular SSR / server integration).

[build]
  command = "pnpm run build"
  publish = "dist/quizzy-front/browser"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
