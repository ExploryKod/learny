# Site root = this repo (learny). Nx `project.json` is at the root → packagePath = "."
# If you also enabled @netlify/angular-runtime in the Netlify UI, remove it there so
# the plugin is not registered twice; this file is the source of truth.

[build]
  command = "pnpm run build"
  publish = "dist/quizzy-front/browser"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[plugins]]
  package = "@netlify/angular-runtime"
  [plugins.inputs]
    packagePath = "."
