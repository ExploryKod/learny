# Static deploy of the Angular `browser` bundle. No @netlify/angular-runtime
# plugin: v3.x does not declare `packagePath` (or any) inputs, and the runtime is
# mainly for Netlify + Angular SSR. Clear any plugin inputs in the Netlify UI
# (Site settings → Build & deploy) if the plugin is still installed there.
[build]
  command = "pnpm run build"
  publish = "dist/quizzy-front/browser"

# Angular client-side routing: serve index.html for unknown paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
