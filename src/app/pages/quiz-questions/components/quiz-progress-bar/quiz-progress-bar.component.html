<div
  class="quiz-progress"
  role="progressbar"
  [attr.aria-label]="ariaLabel"
  aria-valuemin="0"
  [attr.aria-valuemax]="safeMax"
  [attr.aria-valuenow]="safeValue"
>
  <progress
    class="quiz-progress__native"
    [attr.aria-label]="ariaLabel"
    [value]="safeValue"
    [max]="safeMax"
  >
    {{ safeValue }} / {{ safeMax }}
  </progress>
  <div class="quiz-progress__track" aria-hidden="true">
    <span class="quiz-progress__fill" [style.width.%]="progressPercent"></span>
  </div>
</div>
